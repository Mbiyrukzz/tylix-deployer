<link rel="icon" type="image/png" href="/favicon.png">
<meta name="color-scheme" content="dark light">
<script src="/app-shell.js"></script>
<script src="/auth-ui.js"></script>
<!--
  Hovering a link (or pressing on it on touch screens) renders the next page
  in the background, so the click opens it at once (Chromium browsers; others
  ignore this). Pages that start something just by opening are only
  prefetched: terminals open an SSH session, server-detail starts a live
  stats stream, accept-invite can accept an invitation. Mark any other link
  with data-no-prerender to keep it out.
-->
<script type="speculationrules">
{
  "prerender": [{
    "where": { "and": [
      { "href_matches": "/*" },
      { "not": { "href_matches": "/api/*" } },
      { "not": { "href_matches": "/servers/server-terminal*" } },
      { "not": { "href_matches": "/servers/site-terminal*" } },
      { "not": { "href_matches": "/servers/server-detail*" } },
      { "not": { "href_matches": "/accept-invite*" } },
      { "not": { "selector_matches": "[data-no-prerender], [download], [target=_blank]" } }
    ]},
    "eagerness": "moderate"
  }],
  "prefetch": [{
    "where": { "and": [
      { "href_matches": "/*" },
      { "not": { "href_matches": "/api/*" } },
      { "not": { "selector_matches": "[download], [target=_blank]" } }
    ]},
    "eagerness": "moderate"
  }]
}
</script>
