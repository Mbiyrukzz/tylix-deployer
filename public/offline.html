<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Tylix Flux</title>
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root { --bg: #f5f5f4; --panel: #fff; --ink: #18181b; --muted: #71717a; --line: #e7e5e4; --brand: #e0393f; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0b; --panel: #131315; --ink: #f4f4f5; --muted: #a1a1aa; --line: rgb(255 255 255 / 0.08); } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 420px; width: 100%; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 40px 28px; }
  img { width: 56px; height: 56px; margin: 0 auto 20px; display: block; }
  h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: -0.01em; }
  p { margin: 0 0 24px; color: var(--muted); }
  button { font: inherit; font-weight: 600; font-size: 14px; border: 0; border-radius: 999px; padding: 10px 22px; background: var(--brand); color: #fff; cursor: pointer; }
  small { display: block; margin-top: 16px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <img src="/logo-mark.png" alt="">
  <h1>You’re offline</h1>
  <p>Tylix Flux can’t reach the network right now. Your servers and sites keep running; this page reloads by itself when you’re back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <small>Deploys, terminals and live logs need a connection.</small>
</main>
<script>addEventListener('online', function () { location.reload() })</script>
</body>
</html>
